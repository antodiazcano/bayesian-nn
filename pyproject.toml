[project]
name = "bayesian-nn"
version = "0.1.0"
description = "Building a bayesian nn."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bandit>=1.9.4",
    "black>=26.3.1",
    "complexipy>=5.4.1",
    "flake8>=7.3.0",
    "flake8-pyproject>=1.2.4",
    "ipykernel>=7.3.0",
    "isort>=8.0.1",
    "matplotlib>=3.11.0",
    "mypy>=2.1.0",
    "numpy>=2.5.0",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "scikit-learn>=1.6.0",
    "seaborn>=0.13.2",
    "torch>=2.12.1",
]

[[tool.mypy.overrides]]
module = "seaborn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
ignore = ["E203", "W503"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov src"

[tool.coverage.run]
omit = ["src/main.py"]

[tool.isort]
profile = "black"
lines_after_imports = 2
